name: APEX-PROTO 24h Auto Collector

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: apex-proto-bot
  cancel-in-progress: false

jobs:
  run-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install requirements
        run: pip install -r requirements.txt

      - name: 4. Restore AI cache
        uses: actions/cache@v4
        with:
          path: team_issue_ai_cache.json
          key: apex-ai-cache-${{ github.run_id }}
          restore-keys: |
            apex-ai-cache-

      - name: 5. Run APEX-PROTO Collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python apex_proto_v5_collector.py --once --mode all
